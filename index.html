<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Proker Sekolah — SMAN 1 Kamal Bangkalan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%232563EB%22/><text x=%2250%25%22 y=%2260%25%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22white%22>E</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>.mi{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;vertical-align:middle;}</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="view-login" class="login-wrap">
  <div class="login-card">
    <div class="login-card-header">
      <span><span class="tech-dot"></span>MODUL AUTENTIKASI SISTEM</span>
      <span class="badge-id">AUT-01</span>
    </div>
    <div class="login-card-body">
      <h1 class="login-title">E-Proker Sekolah</h1>
      <p class="login-sub">Penyusunan Program Kerja Tahunan Waka &amp; Koordinator — SMAN 1 Kamal Bangkalan</p>
      <div id="login-error" class="login-error hidden"></div>
      <form id="form-login">
        <div class="field">
          <label for="login-username">Username <span class="req">[WAJIB]</span></label>
          <input type="text" id="login-username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Kata Sandi <span class="req">[WAJIB]</span></label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">MASUK SISTEM →</button>
      </form>
      <p class="field-hint" style="margin-top:var(--space-md);">Akun didaftarkan oleh Superadmin. Hubungi Admin TU jika belum memiliki akun.</p>
    </div>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="view-app" class="app-shell hidden">
  <aside class="sidebar" id="sidebar">
    <div>
      <div class="sidebar-brand" id="sidebar-user-block">
        <div class="flex items-center gap-sm" style="margin-bottom:4px;">
          <span class="avatar-chip" id="sidebar-user-avatar"></span>
          <div style="min-width:0;">
            <div id="sidebar-user-nama" style="font-weight:700;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
            <div id="sidebar-user-role"></div>
          </div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </div>
    <div class="sidebar-user">
      <a class="nav-item" style="margin:0 -16px;color:#FCA5A5;" onclick="logout()"><span class="mi">power_settings_new</span><span>[X] Keluar / Logout</span></a>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="flex items-center gap-sm">
        <button class="btn btn-secondary btn-sm menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><span class="mi">menu</span></button>
        <span class="app-logo">E</span>
        <div>
          <h2 id="page-title" style="font-size:14px;">E-PROKER SEKOLAH</h2>
          <span class="field-hint" id="topbar-tahun">TA —</span>
        </div>
      </div>
      <div class="flex items-center gap-md">
        <span class="mi" style="color:var(--ink);">notifications</span>
      </div>
    </div>
    <div class="content" id="page-content"></div>
  </div>
</div>

<div id="toast-wrap"></div>

<script src="js/api.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/proker.js"></script>
<script src="js/pages/anggaran.js"></script>
<script src="js/pages/admin.js"></script>
<script src="js/pages/cetak.js"></script>
<script src="js/app.js"></script>
</body>
</html>
